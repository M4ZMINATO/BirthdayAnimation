<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday Ishika</title>

<style>

body{
margin:0;
font-family: 'Segoe UI', sans-serif;
background: linear-gradient(135deg,#0f0c29,#302b63,#24243e);
color:white;
text-align:center;
overflow-x:hidden;
}

/* Loading Screen */

#loader{
position:fixed;
width:100%;
height:100%;
background:#000;
display:flex;
justify-content:center;
align-items:center;
font-size:30px;
z-index:10;
}

.container{
padding-top:100px;
display:none;
}

/* Title */

h1{
font-size:50px;
color:#ff4da6;
animation: glow 2s infinite alternate;
}

@keyframes glow{
from{text-shadow:0 0 10px #ff4da6;}
to{text-shadow:0 0 25px #ff99cc;}
}

/* Button */

button{
padding:14px 28px;
font-size:18px;
border:none;
border-radius:30px;
background:#ff4da6;
color:white;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.1);
}

/* Message */

#message{
margin-top:30px;
font-size:20px;
width:80%;
margin-left:auto;
margin-right:auto;
}

/* Gallery */

.gallery{
margin-top:40px;
display:none;
}

.gallery img{
width:200px;
height:200px;
object-fit:cover;
margin:10px;
border-radius:15px;
transition:0.4s;
}

.gallery img:hover{
transform:scale(1.15);
}

/* Hearts */

.heart{
position:fixed;
bottom:-10px;
font-size:24px;
animation:float 5s linear infinite;
}

@keyframes float{
0%{transform:translateY(0)}
100%{transform:translateY(-110vh)}
}

</style>
</head>

<body>

<div id="loader">
Loading your surprise...
</div>

<audio autoplay loop>
<source src="music.mp3" type="audio/mp3">
</audio>

<div class="container" id="main">

<h1>Happy Birthday Ishika 🎂</h1>

<p>A small surprise made specially for you 💖</p>

<button onclick="startSurprise()">Open Your Surprise 🎁</button>

<div id="message"></div>

<div class="gallery" id="gallery">
<img src="photo1.jpg">
<img src="photo2.jpg">
<img src="photo3.jpg">
</div>

</div>

<script>

/* Loader */

setTimeout(()=>{
document.getElementById("loader").style.display="none";
document.getElementById("main").style.display="block";
},3000);


/* Typing Message */

let text = "Ishika, you are someone very special. Your smile makes days brighter and your presence makes everything better. I hope this small surprise makes you smile. May your birthday be filled with happiness, laughter and unforgettable moments. Happy Birthday once again! 💖";

let i = 0;

function typeMessage(){
if(i < text.length){
document.getElementById("message").innerHTML += text.charAt(i);
i++;
setTimeout(typeMessage,40);
}
}

/* Surprise Button */

function startSurprise(){

typeMessage();

document.getElementById("gallery").style.display="block";

setInterval(createHeart,300);

}

/* Floating Hearts */

function createHeart(){

let heart=document.createElement("div");

heart.className="heart";
heart.innerHTML="💖";

heart.style.left=Math.random()*100+"vw";

document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},5000)

}

</script>

</body>
</html>
